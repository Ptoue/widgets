<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRL Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent; /* Läpinäkyvä tausta OBS:ää varten */
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }

    /* Pääpaneeli / HUD */
    .hud-container {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .value {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* Korostusvärit eri elementeille */
    .time-val { color: #f8fafc; font-variant-numeric: tabular-nums; }
    .speed-val { color: #38bdf8; font-variant-numeric: tabular-nums; }
    .city-val { color: #a855f7; }
    .weather-val { color: #facc15; }

    /* Erotinviivat kenttien välille */
    .divider {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="hud-container">
    <!-- Kello -->
    <div class="hud-item">
      <span class="label">Kello</span>
      <span class="value time-val" id="clock">--:--:--</span>
    </div>

    <div class="divider"></div>

    <!-- Nopeus -->
    <div class="hud-item">
      <span class="label">Nopeus</span>
      <span class="value speed-val" id="speed">0 km/h</span>
    </div>

    <div class="divider"></div>

    <!-- Sijainti -->
    <div class="hud-item">
      <span class="label">Sijainti</span>
      <span class="value city-val" id="location">Haetaan...</span>
    </div>

    <div class="divider"></div>

    <!-- Sää -->
    <div class="hud-item">
      <span class="label">Sää</span>
      <span class="value weather-val" id="weather">--°C</span>
    </div>
  </div>

  <script>
    // 1. KELLONAIKA
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('fi-FI', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. GPS & NOPEUS
    let lastWeatherUpdate = 0;
    let lastLat = null;
    let lastLon = null;

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const coords = position.coords;
          
          // Nopeus (selain antaa nopeuden metreinä sekunnissa m/s -> muunnetaan km/h)
          let speedKmh = 0;
          if (coords.speed !== null && coords.speed > 0) {
            speedKmh = Math.round(coords.speed * 3.6);
          }
          document.getElementById('speed').textContent = `${speedKmh} km/h`;

          // Päivitetään sää ja kaupunki vain jos sijainti muuttuu merkittävästi tai 10 min välein
          const now = Date.now();
          if (!lastLat || (now - lastWeatherUpdate > 10 * 60 * 1000)) {
            lastLat = coords.latitude;
            lastLon = coords.longitude;
            lastWeatherUpdate = now;
            fetchLocationName(coords.latitude, coords.longitude);
            fetchWeather(coords.latitude, coords.longitude);
          }
        },
        (error) => {
          console.warn('GPS-virhe:', error.message);
          document.getElementById('location').textContent = 'GPS ei saatavilla';
        },
        {
          enableHighAccuracy: true, // Käytetään tarkkaa GPS-sirua puhelimessa
          maximumAge: 1000,
          timeout: 10000
        }
      );
    } else {
      document.getElementById('location').textContent = 'Ei GPS-tukea';
    }

    // 3. KAUPUNGIN NIMI (Reverse Geocoding)
    async function fetchLocationName(lat, lon) {
      try {
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fi`);
        const data = await res.json();
        const city = data.city || data.locality || data.principalSubdivision || 'Tuntematon';
        document.getElementById('location').textContent = city;
      } catch (err) {
        console.error('Virhe paikannuksessa:', err);
      }
    }

    // 4. SÄÄTIETO (Open-Meteo, täysin ilmainen, ei vaadi avaimia)
    async function fetchWeather(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`;
        const res = await fetch(url);
        const data = await res.json();
        
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;
        const icon = getWeatherIcon(code);

        document.getElementById('weather').textContent = `${icon} ${temp}°C`;
      } catch (err) {
        console.error('Virhe säätiedoissa:', err);
      }
    }

    // WMO Weather Codes -> Emojit
    function getWeatherIcon(code) {
      if (code === 0) return '☀️';
      if ([1, 2, 3].includes(code)) return '⛅';
      if ([45, 48].includes(code)) return '🌫️';
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return '🌧️';
      if ([71, 73, 75, 77, 85, 86].includes(code)) return '🌨️';
      if ([95, 96, 99].includes(code)) return '⛈️';
      return '🌡️';
    }
  </script>
</body>
</html>
