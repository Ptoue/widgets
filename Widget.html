<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One IRL Stream Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #ffffff;
      padding: 14px;
      overflow: hidden;
    }

    /* Pääpalkki - Tyylikäs tumma lasiefekti */
    .hud-bar {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .widget {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 1px;
    }

    .value {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Värikoodaukset */
    .val-time    { color: #f8fafc; }
    .val-speed   { color: #38bdf8; } /* Taivaansininen */
    .val-steps   { color: #10b981; } /* Vihreä */
    .val-loc     { color: #c084fc; font-weight: 600; } /* Violetti */
    .val-weather { color: #facc15; } /* Keltainen */
    .val-net     { color: #fb923c; } /* Oranssi */
    .val-bat     { color: #4ade80; } /* Vaaleanvihreä */
    .val-sub     { color: #94a3b8; font-size: 11px; margin-left: 2px; }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="hud-bar">
    
    <!-- 1. Kello & Kesto -->
    <div class="widget">
      <span class="label">Kello / Kesto</span>
      <span class="value val-time">
        <span id="clock">--:--:--</span>
        <span class="val-sub" id="timer">(00:00)</span>
      </span>
    </div>

    <div class="divider"></div>

    <!-- 2. Askeleet -->
    <div class="widget">
      <span class="label">Askeleet</span>
      <span class="value val-steps">
        👟 <span id="steps">0</span>
      </span>
    </div>

    <div class="divider"></div>

    <!-- 3. Nopeus & Matka -->
    <div class="widget">
      <span class="label">Nopeus / Matka</span>
      <span class="value val-speed">
        <span id="speed">0 km/h</span>
        <span class="val-sub" id="distance">0.0 km</span>
      </span>
    </div>

    <div class="divider"></div>

    <!-- 4. Tarkka Sijainti & Korkeus -->
    <div class="widget">
      <span class="label">Sijainti / Korkeus</span>
      <span class="value val-loc">
        📍 <span id="location">Etsitään...</span>
        <span class="val-sub" id="altitude">-- m</span>
      </span>
    </div>

    <div class="divider"></div>

    <!-- 5. Sää -->
    <div class="widget">
      <span class="label">Sää</span>
      <span class="value val-weather" id="weather">--°C</span>
    </div>

    <div class="divider"></div>

    <!-- 6. Mobiiliyhteys -->
    <div class="widget">
      <span class="label">Verkko</span>
      <span class="value val-net" id="network">📶 4G</span>
    </div>

    <div class="divider"></div>

    <!-- 7. Akku -->
    <div class="widget">
      <span class="label">Akku</span>
      <span class="value val-bat" id="battery">🔋 --%</span>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. KELLONAIKA & STRIIMIN KESTO
    // ==========================================
    const startTime = Date.now();
    function updateTimes() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fi-FI', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });

      // Kesto
      const diffSec = Math.floor((Date.now() - startTime) / 1000);
      const hrs = Math.floor(diffSec / 3600);
      const mins = Math.floor((diffSec % 3600) / 60);
      const secs = diffSec % 60;
      const pad = n => String(n).padStart(2, '0');
      
      document.getElementById('timer').textContent = hrs > 0 
        ? `(${pad(hrs)}:${pad(mins)}:${pad(secs)})` 
        : `(${pad(mins)}:${pad(secs)})`;
    }
    setInterval(updateTimes, 1000);
    updateTimes();

    // ==========================================
    // 2. ASKELMITTARI (Automaattinen käynnistys)
    // ==========================================
    let steps = parseInt(localStorage.getItem('stream_steps')) || 0;
    const stepEl = document.getElementById('steps');
    stepEl.textContent = steps.toLocaleString('fi-FI');

    let lastStepTime = 0;
    const STEP_THRESHOLD = 12.0; // Kiihtyvyyden herkkyys m/s²
    const MIN_STEP_DELAY = 320;   // Maksimissaan ~3 askelta / sekunti

    function handleMotion(e) {
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc || acc.x === null) return;

      const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      const now = Date.now();

      if (mag > STEP_THRESHOLD && (now - lastStepTime) > MIN_STEP_DELAY) {
        steps++;
        lastStepTime = now;
        stepEl.textContent = steps.toLocaleString('fi-FI');
        localStorage.setItem('stream_steps', steps);
      }
    }

    // Käynnistetään anturi heti ilman napin painallusta
    try {
      window.addEventListener('devicemotion', handleMotion, true);
    } catch (err) {
      console.warn('Sensorin käynnistysvirhe:', err);
    }

    // ==========================================
    // 3. GPS, NOPEUS, MATKA & KORKEUS
    // ==========================================
    let prevLat = null;
    let prevLon = null;
    let totalDistKm = 0;
    let lastWeatherUpdate = 0;

    // Haversine-kaava etäisyyden laskemiseen
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed, altitude, accuracy } = pos.coords;

          // Nopeus (m/s -> km/h)
          const kmh = (speed !== null && speed > 0.5) ? Math.round(speed * 3.6) : 0;
          document.getElementById('speed').textContent = `${kmh} km/h`;

          // Korkeus
          if (altitude !== null) {
            document.getElementById('altitude').textContent = `${Math.round(altitude)} m`;
          }

          // Kuljettu matka (vain jos tarkkuus on hyvä ja liike > 5m)
          if (prevLat !== null && prevLon !== null) {
            const dist = calcDistance(prevLat, longitude, latitude, longitude);
            if (dist > 0.005 && accuracy < 35) {
              totalDistKm += dist;
              document.getElementById('distance').textContent = `${totalDistKm.toFixed(1)} km`;
            }
          }

          // Paikannus ja sää (päivitetään alussa tai 5 min välein)
          const now = Date.now();
          if (!prevLat || (now - lastWeatherUpdate > 5 * 60 * 1000)) {
            fetchAccurateLocation(latitude, longitude);
            fetchWeather(latitude, longitude);
            lastWeatherUpdate = now;
          }

          prevLat = latitude;
          prevLon = longitude;
        },
        (err) => console.warn('GPS-virhe:', err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    // ==========================================
    // 4. TARKKA SIJAINTI (Kylä/Alue + Kaupunki)
    // ==========================================
    async function fetchAccurateLocation(lat, lon) {
      try {
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fi`);
        const data = await res.json();
        
        const area = data.locality || '';
        const city = data.city || data.principalSubdivision || '';

        let locString = 'Tuntematon';
        if (area && city && area !== city) {
          locString = `${area}, ${city}`;
        } else if (city) {
          locString = city;
        } else if (area) {
          locString = area;
        }

        document.getElementById('location').textContent = locString;
      } catch (e) {
        console.error('Sijaintivirhe:', e);
      }
    }

    // ==========================================
    // 5. SÄÄTIEDOT
    // ==========================================
    async function fetchWeather(lat, lon) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`);
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const icon = getWeatherIcon(data.current.weather_code);
        document.getElementById('weather').textContent = `${icon} ${temp}°C`;
      } catch (e) {
        console.error('Säävirhe:', e);
      }
    }

    function getWeatherIcon(code) {
      if (code === 0) return '☀️';
      if ([1, 2, 3].includes(code)) return '⛅';
      if ([45, 48].includes(code)) return '🌫️';
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return '🌧️';
      if ([71, 73, 75, 77, 85, 86].includes(code)) return '🌨️';
      if ([95, 96, 99].includes(code)) return '⛈️';
      return '🌡️';
    }

    // ==========================================
    // 6. MOBIILIYHTEYS
    // ==========================================
    function updateNetworkStatus() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const netEl = document.getElementById('network');
      
      if (conn) {
        const type = (conn.effectiveType || '4G').toUpperCase();
        const speed = conn.downlink ? `${Math.round(conn.downlink)}M` : '';
        netEl.textContent = `📶 ${type} ${speed}`.trim();
      } else {
        netEl.textContent = navigator.onLine ? '📶 Online' : '⚠️ Offline';
      }
    }
    if (navigator.connection) {
      navigator.connection.addEventListener('change', updateNetworkStatus);
    }
    updateNetworkStatus();

    // ==========================================
    // 7. AKUN VARAUS
    // ==========================================
    if ('getBattery' in navigator) {
      navigator.getBattery().then((battery) => {
        function updateBat() {
          const level = Math.round(battery.level * 100);
          const icon = battery.charging ? '⚡' : '🔋';
          document.getElementById('battery').textContent = `${icon} ${level}%`;
        }
        updateBat();
        battery.addEventListener('levelchange', updateBat);
        battery.addEventListener('chargingchange', updateBat);
      });
    } else {
      // Jos laite (kuten Safari/iOS) ei tue akun varaustilan lukemista
      document.getElementById('battery').parentElement.style.display = 'none';
    }
  </script>
</body>
</html>
