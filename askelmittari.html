<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askelmittari Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }

    /* Tyylikäs HUD-paneeli */
    .step-container {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .icon {
      font-size: 24px;
    }

    .info {
      display: flex;
      flex-direction: column;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .value {
      font-size: 20px;
      font-weight: 700;
      color: #10b981; /* Raikas vihreä */
      font-variant-numeric: tabular-nums;
    }

    /* iOS vaatii napautuksen luvan antamiseen */
    #start-btn {
      background: #10b981;
      border: none;
      color: white;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    #reset-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 9px;
      cursor: pointer;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="step-container">
    <div class="icon">👟</div>
    
    <div class="info">
      <span class="label">Askeleet</span>
      <span class="value" id="step-count">0</span>
    </div>

    <!-- Nappi iPhonelle luvan pyytämiseen ja nollaukseen -->
    <button id="start-btn" onclick="initSensors()">Käynnistä</button>
    <button id="reset-btn" onclick="resetSteps()" title="Nollaa laskuri">Nollaa</button>
  </div>

  <script>
    // Haetaan aiemmat askeleet muistista
    let steps = parseInt(localStorage.getItem('stream_steps')) || 0;
    const stepDisplay = document.getElementById('step-count');
    stepDisplay.textContent = steps.toLocaleString('fi-FI');

    // Askelten tunnistuksen muuttujat
    let lastMagnitude = 9.8;
    let lastStepTime = 0;
    
    // Askeleen herkkyysasetukset (voit hienosäätää tarvittaessa)
    const STEP_THRESHOLD = 12.2; // m/s^2 kiihtyvyyden kynnysarvo
    const MIN_STEP_DELAY = 320;   // Minimiaika askelten välillä ms (estää tuplat)

    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;

      // Lasketaan kokonaiskiihtyvyys (vektorin pituus: sqrt(x² + y² + z²))
      const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      const currentTime = Date.now();

      // Tunnistetaan askeleen aiheuttama kiihtyvyyspiikki
      if (magnitude > STEP_THRESHOLD && (currentTime - lastStepTime) > MIN_STEP_DELAY) {
        steps++;
        lastStepTime = currentTime;
        
        // Päivitetään ruudulle ja tallennetaan muistiin
        stepDisplay.textContent = steps.toLocaleString('fi-FI');
        localStorage.setItem('stream_steps', steps);
      }

      lastMagnitude = magnitude;
    }

    // Käynnistetään anturit (erityisesti iOS vaatii käyttäjän klikkauksen lupaa varten)
    function initSensors() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', handleMotion);
              document.getElementById('start-btn').style.display = 'none';
            } else {
              alert('Liikeanturin käyttö estetty!');
            }
          })
          .catch(console.error);
      } else {
        // Android ja tavalliset selaimet
        window.addEventListener('devicemotion', handleMotion);
        document.getElementById('start-btn').style.display = 'none';
      }
    }

    function resetSteps() {
      if (confirm('Haluatko nollata askelmäärän?')) {
        steps = 0;
        localStorage.setItem('stream_steps', 0);
        stepDisplay.textContent = '0';
      }
    }

    // Yritetään käynnistää automaattisesti Androidilla
    window.addEventListener('load', () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
        initSensors();
      }
    });
  </script>
</body>
</html>
